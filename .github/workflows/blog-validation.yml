name: Validate blog and Jekyll build
on:
  pull_request:
    paths:
      - '_config.yml'
      - 'Gemfile'
      - '_layouts/**'
      - '_posts/**'
      - '_drafts/**'
      - 'artigos/**'
      - 'blog.css'
      - 'blog.js'
      - 'design-system/tokens/**'
      - 'design-system/components/**'
      - 'design-system/theme/**'
      - 'blog-mermaid.js'
      - 'feed.xml'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/validate-blog.mjs'
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/blog-validation.yml'
  push:
    branches: [main]
    paths:
      - '_config.yml'
      - 'Gemfile'
      - '_layouts/**'
      - '_posts/**'
      - '_drafts/**'
      - 'artigos/**'
      - 'blog.css'
      - 'blog.js'
      - 'design-system/tokens/**'
      - 'design-system/components/**'
      - 'design-system/theme/**'
      - 'blog-mermaid.js'
      - 'feed.xml'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/validate-blog.mjs'
      - 'index.html'
      - '.nojekyll'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate blog files and publishing contract
        run: node scripts/validate-blog.mjs
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with GitHub Pages Jekyll stack
        run: bundle exec jekyll build --trace
      - name: Verify generated routes
        run: |
          test -f _site/index.html
          test -f _site/artigos/index.html
          test -f _site/feed.xml
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/CNAME
          test -f _site/design-system/theme/theme.js
          grep -q 'data-theme-toggle' _site/artigos/index.html
          grep -q 'design-system/theme/theme.js' _site/artigos/index.html
          grep -q 'data-theme-toggle' _site/artigos/chatgpt-como-camada-de-preparacao/index.html
          grep -q 'Engineering Notes' _site/artigos/index.html || grep -q 'Publicações' _site/artigos/index.html
          test -f _site/artigos/chatgpt-como-camada-de-preparacao/index.html
          test -f _site/blog-mermaid.js
          grep -q 'ChatGPT como camada de preparação' _site/artigos/chatgpt-como-camada-de-preparacao/index.html
          ! grep -q 'Notas editoriais' _site/artigos/chatgpt-como-camada-de-preparacao/index.html
          ! grep -q 'Rascunho editorial' _site/artigos/chatgpt-como-camada-de-preparacao/index.html
          # Verify the generated page is readable, not merely buildable.
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const html = readFileSync("_site/artigos/chatgpt-como-camada-de-preparacao/index.html", "utf8");
            const diagrams = (html.match(/data-diagram-widget/g) || []).length;
            const paragraphs = (html.match(/<p(?:\s[^>]*)?>/g) || []).length;
            if (diagrams !== 2) throw Error("Expected 2 static diagram viewers; got " + diagrams);
            if (paragraphs < 45) throw Error("Collapsed article paragraphs: got " + paragraphs);
            if (html.includes("Notas editoriais") || html.includes("discussion-urls=")) {
              throw Error("Private Notion metadata leaked into article");
            }
            if (!html.includes("blog-mermaid.js")) throw Error("Missing diagram controls in layout");
            if (!html.includes("data-diagram-mode=\"code\"")) throw Error("Code view missing");
            for (const name of ["architecture", "sequence"]) {
              if (!html.includes(name + ".svg")) throw Error("SVG missing from article: " + name);
              const svg = readFileSync("_site/assets/artigos/chatgpt-como-camada-de-preparacao/" + name + ".svg", "utf8");
              if (!/<svg\b/.test(svg) || !/<\/svg>/.test(svg)) {
                throw Error("Invalid generated SVG: " + name);
              }
            }
            console.log("Rendered HTML verified: " + diagrams + " diagrams, " + paragraphs + " paragraphs");
          '

          # Validate the newly published ART-3 article, not just the example article.
          test -f _site/artigos/a-ia-escreve-quem-paga-o-custo-de-verificar/index.html
          test -f _site/assets/artigos/a-ia-escreve-quem-paga-o-custo-de-verificar/producao-verificacao.svg
          test -f _site/assets/artigos/a-ia-escreve-quem-paga-o-custo-de-verificar/runtime-admission.svg
          test -f _site/diagrams/article-a-ia-escreve-quem-paga-o-custo-de-verificar-producao-verificacao.mmd
          test -f _site/diagrams/article-a-ia-escreve-quem-paga-o-custo-de-verificar-runtime-admission.mmd
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const slug = "a-ia-escreve-quem-paga-o-custo-de-verificar";
            const page = readFileSync("_site/artigos/" + slug + "/index.html", "utf8");
            const index = readFileSync("_site/artigos/index.html", "utf8");
            const feed = readFileSync("_site/feed.xml", "utf8");
            const sitemap = readFileSync("_site/sitemap.xml", "utf8");
            const count = (page.match(/<p(?:\s[^>]*)?>/g) || []).length;
            const viewers = (page.match(/data-diagram-widget/g) || []).length;
            if (count < 45 || viewers !== 2) throw Error("ART-3 invalid: paragraphs=" + count + " diagrams=" + viewers);
            if (!page.includes("data-diagram-mode=\"code\"") || !page.includes("data-diagram-copy")) throw Error("ART-3 viewer controls absent");
            if (/discussion-urls|Nota editorial:|Rascunho integral|Notas editoriais/.test(page)) throw Error("Editorial draft metadata leaked");
            for (const name of ["producao-verificacao", "runtime-admission"]) {
              const src = readFileSync("_site/diagrams/article-" + slug + "-" + name + ".mmd", "utf8").trim();
              const svg = readFileSync("_site/assets/artigos/" + slug + "/" + name + ".svg", "utf8");
              if (!svg.includes("<svg") || !svg.includes("</svg>")) throw Error("Invalid SVG " + name);
              if (!page.includes(name + ".svg") || !page.includes("article-" + slug + "-" + name + ".mmd")) throw Error("Missing viewer link " + name);
              if (!src.startsWith(name === "producao-verificacao" ? "flowchart" : "sequenceDiagram")) throw Error("Wrong source " + name);
            }
            if (![index, feed, sitemap].every(v => v.includes(slug))) throw Error("ART-3 not indexed in blog/feed/sitemap");
            console.log("ART-3 route, metadata, paragraphs, 2 SVG viewers, sources, RSS and sitemap verified: " + count + " paragraphs");
          '
